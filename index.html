<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f9f9" />
  <meta name="description" content="Cartes de découverte pour propriétaires de centres auditifs et responsables de centrales." />
  <title>Découverte Audio · Demant</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #173646;
      --muted: #637a82;
      --teal: #087d80;
      --border: #dce6e7;
      --surface: #ffffff;
      --background: #f7f9f9;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--background);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    button:focus-visible { outline: 3px solid #66c7c4; outline-offset: 3px; }
    .skip-link { position: absolute; top: -80px; left: 10px; background: #fff; padding: 12px; z-index: 10; }
    .skip-link:focus { top: 8px; }
    main { max-width: 740px; margin: 0 auto; padding: 22px 18px 70px; }
    .profile-card, .topic-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 13px;
    }
    .profile-card { padding: 21px; }
    h1, h2 { margin: 0; letter-spacing: -.025em; }
    h1 { font-size: 1.08rem; line-height: 1.35; margin-bottom: 15px; font-weight: 730; }
    .profile-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .profile-btn {
      min-height: 54px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #fff;
      color: var(--ink);
      padding: 12px 14px;
      text-align: center;
      font-size: .92rem;
      font-weight: 650;
      line-height: 1.3;
      transition: background .12s ease, border-color .12s ease;
    }
    .profile-btn[aria-pressed="true"] {
      background: #e9f5f3;
      border-color: #6dbdbb;
      color: #076b6c;
    }
    .topics { margin-top: 25px; }
    h2 { font-size: 1rem; font-weight: 720; margin: 0 0 12px 2px; }
    .topic-list { display: grid; gap: 9px; }
    .topic-card { overflow: hidden; }
    .topic-card[data-expanded="true"] { border-color: #90c6c3; }
    .topic-toggle {
      width: 100%;
      min-height: 61px;
      padding: 17px 19px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      background: transparent;
      border: 0;
      color: inherit;
      text-align: left;
      font-size: .99rem;
      font-weight: 680;
      line-height: 1.32;
    }
    .chevron {
      flex: none;
      width: 10px;
      height: 10px;
      border-right: 2px solid #82969d;
      border-bottom: 2px solid #82969d;
      transform: rotate(45deg);
      transition: transform .14s ease;
      margin: -5px 3px 0 0;
    }
    .topic-card[data-expanded="true"] .chevron {
      border-color: var(--teal);
      transform: rotate(225deg);
      margin-top: 5px;
    }
    .topic-body { padding: 0 19px 21px; }
    .topic-body[hidden] { display: none; }
    .question-open {
      background: #eff8f6;
      border-radius: 9px;
      padding: 15px 16px;
      font-size: 1.01rem;
      font-weight: 640;
      line-height: 1.52;
    }
    .question-section { margin-top: 20px; }
    .question-section h3 {
      margin: 0 0 7px;
      text-transform: uppercase;
      letter-spacing: .075em;
      font-size: .71rem;
      font-weight: 770;
      color: var(--teal);
    }
    .question-section ul { margin: 0; padding-left: 20px; }
    .question-section li, .question-projection {
      font-size: .9rem;
      line-height: 1.55;
      color: #304e5b;
    }
    .question-section li + li { margin-top: 8px; }
    .question-projection { margin: 0; }
    @media (max-width: 560px) {
      main { padding: 12px 12px 55px; }
      .profile-card { padding: 16px; }
      h1 { margin-bottom: 11px; }
      .profile-options { gap: 8px; }
      .profile-btn { font-size: .82rem; padding: 10px 9px; min-height: 55px; }
      .topics { margin-top: 20px; }
      .topic-list { gap: 8px; }
      .topic-toggle { min-height: 57px; padding: 15px 16px; font-size: .94rem; }
      .topic-body { padding: 0 15px 18px; }
      .question-open { font-size: .95rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#topics">Aller aux thématiques</a>
  <main>
    <section class="profile-card" aria-labelledby="profile-title">
      <h1 id="profile-title">Votre interlocuteur</h1>
      <div class="profile-options" role="group" aria-label="Votre interlocuteur">
        <button type="button" class="profile-btn" data-profile="centre" aria-pressed="true">Propriétaire de centre</button>
        <button type="button" class="profile-btn" data-profile="centrale" aria-pressed="false">Responsable de centrale</button>
      </div>
    </section>
    <section class="topics" id="topics" aria-labelledby="topics-title">
      <h2 id="topics-title">Thématiques</h2>
      <div id="topic-list" class="topic-list"></div>
    </section>
  </main>
  <script>
  (() => {
    "use strict";
    // Contenus issus du guide de découverte validé pour Frédéric.
  const topics = [
    {
      id: "priorites", number: "01", title: "Stratégie & priorités", icon: "compass",
      profile: {
        centre: {
          open: "Quand vous regardez les douze prochains mois, qu'est-ce qui compte le plus pour vous ?",
          explore: ["Quelles sont vos trois priorités, si vous devez vraiment choisir ?", "Quels projets vous mobilisent le plus en ce moment ?", "Sur quoi aimeriez-vous prendre du recul, mais n'en avez-vous pas le temps ?"],
          impact: ["Qu'est-ce qui pourrait vous empêcher d'atteindre ces priorités ?", "Si vous ne faites rien évoluer, qu'est-ce que cela change pour vous et votre équipe ?"],
          projection: "Dans un an, à quoi reconnaîtrez-vous que vous avez réellement avancé ?"
        },
        centrale: {
          open: "Quels sont les enjeux les plus importants pour votre centrale sur les douze prochains mois ?",
          explore: ["Quelles sont vos trois priorités stratégiques aujourd'hui ?", "Sur lesquelles avez-vous une véritable capacité d'action ?", "Comment ces priorités sont-elles perçues par vos adhérents ?"],
          impact: ["Si la centrale n'avance pas sur ces priorités, qu'est-ce que cela implique ?", "Où voyez-vous le plus grand écart entre l'ambition du siège et la réalité du terrain ?"],
          projection: "Qu'aimeriez-vous avoir rendu possible pour vos adhérents d'ici un an ?"
        }
      }
    },
    {
      id: "croissance", number: "02", title: "Croissance & développement", icon: "trend",
      profile: {
        centre: {
          open: "Comment imaginez-vous le développement de votre activité dans les deux prochaines années ?",
          explore: ["Comptez-vous surtout développer l'activité actuelle, ouvrir de nouveaux centres ou réaliser des acquisitions ?", "Quels marchés, territoires ou patientèles représentent encore un potentiel ?", "Quels moyens devrez-vous mobiliser pour grandir ?"],
          impact: ["Qu'est-ce qui freine aujourd'hui cette croissance ?", "Que se passe-t-il si le développement est plus lent que prévu ?"],
          projection: "Quel premier changement vous permettrait de franchir un cap ?"
        },
        centrale: {
          open: "Qu'est-ce qui doit faire progresser votre réseau dans les prochaines années ?",
          explore: ["Votre priorité est-elle de recruter des adhérents, de développer les centres existants ou d'en ouvrir de nouveaux ?", "Qu'est-ce qui attire aujourd'hui un indépendant chez vous ?", "Quels sont les territoires ou profils d'adhérents que vous aimeriez renforcer ?"],
          impact: ["Quels obstacles rencontrez-vous lorsque vous cherchez à convaincre un nouveau membre ?", "Quel effet la croissance du réseau a-t-elle sur vos équipes et vos services ?"],
          projection: "À quoi ressemblerait, pour vous, une croissance réussie du réseau ?"
        }
      }
    },
    {
      id: "rentabilite", number: "03", title: "Rentabilité & marges", icon: "chart",
      profile: {
        centre: {
          open: "Quels sont aujourd'hui les facteurs qui font le plus évoluer votre rentabilité ?",
          explore: ["Comment évoluent vos charges, votre panier moyen et votre activité ?", "Comment pilotez-vous votre mix de gamme et vos prix de vente ?", "Voyez-vous des différences de rentabilité entre vos centres ou vos équipes ?"],
          impact: ["Lorsque votre marge se tend, quels arbitrages êtes-vous amené à faire ?", "Quelles conséquences cela a-t-il sur vos possibilités d'investir ou de recruter ?"],
          projection: "Au-delà d'une remise sur les appareils, qu'est-ce qui améliorerait durablement votre rentabilité ?"
        }
      }
    },
    {
      id: "patientele", number: "04", title: "Acquisition de nouveaux patients", icon: "users",
      profile: {
        centre: {
          open: "Aujourd'hui, comment de nouveaux patients arrivent-ils dans vos centres ?",
          explore: ["Quels canaux vous apportent les contacts les plus intéressants ?", "Quelle place occupent les recommandations et les prescripteurs ?", "Comment travaillez-vous le renouvellement et le bouche-à-oreille ?"],
          impact: ["Qu'est-ce qui se passe lorsqu'un canal vous apporte moins de patients ?", "Avez-vous identifié les points où vous perdez des opportunités ?"],
          projection: "Si vous pouviez améliorer une seule étape de votre acquisition de patients, laquelle choisiriez-vous ?"
        }
      }
    },
    {
      id: "parcours", number: "05", title: "Parcours patient & essais", icon: "route",
      profile: {
        centre: {
          open: "Comment se déroule le parcours d'un patient, du premier contact jusqu'à l'appareillage ?",
          explore: ["Comment organisez-vous l'accueil, les essais et les rendez-vous de suivi ?", "À quel moment certains patients hésitent-ils ou interrompent-ils leur parcours ?", "Comment suivez-vous les essais en cours et les devis non aboutis ?"],
          impact: ["Quand un essai n'aboutit pas, savez-vous généralement pourquoi ?", "Qu'est-ce que cela représente pour le patient, l'équipe et le centre ?"],
          projection: "Qu'aimeriez-vous fluidifier dans ce parcours pour les patients comme pour vos collaborateurs ?"
        }
      }
    },
    {
      id: "equipes", number: "06", title: "Recrutement & fidélisation", icon: "team",
      profile: {
        centre: {
          open: "Comment se porte votre équipe d'audioprothésistes aujourd'hui ?",
          explore: ["Quels profils sont les plus difficiles à recruter ?", "Qu'est-ce qui donne envie à vos meilleurs collaborateurs de rester ?", "Quels besoins de formation ou d'accompagnement observez-vous ?"],
          impact: ["Si un collaborateur clé quittait l'entreprise demain, quelles seraient les conséquences ?", "Combien de temps vous faut-il habituellement pour rendre une nouvelle recrue autonome ?"],
          projection: "Qu'est-ce qui rendrait votre structure plus attractive pour recruter et fidéliser ?"
        }
      }
    },
    {
      id: "concurrence", number: "07", title: "Concurrence & différenciation", icon: "target",
      profile: {
        centre: {
          open: "Qu'est-ce qui fait qu'un patient choisit votre centre plutôt qu'un autre ?",
          explore: ["Quels types de concurrents font le plus évoluer votre marché local ?", "Quels éléments de votre accompagnement sont les plus appréciés ?", "Comment expliquez-vous ce qui vous différencie, au-delà des produits et des prix ?"],
          impact: ["Dans quelles situations avez-vous le sentiment de perdre un patient face à un concurrent ?", "Quels efforts cette pression concurrentielle impose-t-elle à l'équipe ?"],
          projection: "Quelle image aimeriez-vous que votre centre ait auprès des patients dans un an ?"
        },
        centrale: {
          open: "Qu'est-ce qui rend votre groupement réellement différent aux yeux d'un indépendant ?",
          explore: ["Pourquoi un audioprothésiste rejoint-il votre réseau plutôt qu'un autre ?", "Quelles promesses sont les plus difficiles à tenir dans la durée ?", "Quels atouts votre réseau possède-t-il que vos adhérents valorisent peu aujourd'hui ?"],
          impact: ["Quand un adhérent envisage de partir, qu'est-ce qui est généralement en jeu ?", "Quelles conséquences une différenciation insuffisante aurait-elle sur la fidélisation des membres ?"],
          projection: "Sur quoi aimeriez-vous que votre centrale soit reconnue en priorité ?"
        }
      }
    },
    {
      id: "orl", number: "08", title: "Relations ORL & prescripteurs", icon: "link",
      profile: {
        centre: {
          open: "Comment entretenez-vous aujourd'hui vos relations avec les ORL et les autres prescripteurs ?",
          explore: ["Quelles relations fonctionnent particulièrement bien, et pourquoi ?", "Qu'est-ce qui est le plus difficile à construire ou à maintenir ?", "Comment impliquez-vous vos audioprothésistes dans cette relation ?"],
          impact: ["Quel impact une relation prescripteur fragile a-t-elle sur l'activité du centre ?", "Que se passe-t-il lorsque l'un de vos prescripteurs habituels n'oriente plus de patients vers vous ?"],
          projection: "Qu'est-ce qui vous aiderait à développer des relations plus solides et durables ?"
        }
      }
    },
    {
      id: "organisation", number: "09", title: "Organisation & management", icon: "layers",
      profile: {
        centre: {
          open: "Dans le fonctionnement quotidien de vos centres, qu'est-ce qui vous prend aujourd'hui le plus d'énergie ?",
          explore: ["Comment répartissez-vous les rôles entre les audioprothésistes et les équipes d'accueil ?", "Quelles tâches vous obligent à intervenir personnellement ?", "Sur plusieurs centres, qu'est-ce qui est le plus difficile à harmoniser ?"],
          impact: ["Que se passe-t-il lorsque vous n'êtes pas disponible pour arbitrer ?", "Quelle conséquence cette organisation a-t-elle sur la qualité de service et votre temps ?"],
          projection: "Qu'aimeriez-vous déléguer ou simplifier pour retrouver davantage de temps ?"
        }
      }
    },
    {
      id: "services", number: "10", title: "Services proposés aux adhérents", icon: "gift",
      profile: {
        centrale: {
          open: "Parmi tous vos services, lesquels apportent aujourd'hui le plus de valeur aux adhérents ?",
          explore: ["Quels services sont les plus utilisés, et lesquels le sont moins que prévu ?", "Comment identifiez-vous les besoins de vos adhérents ?", "Comment faites-vous connaître vos services et accompagnez-vous leur adoption ?"],
          impact: ["Qu'est-ce qui empêche certains adhérents de profiter pleinement de ces services ?", "Quelles conséquences cette sous-utilisation a-t-elle pour le réseau et vos équipes ?"],
          projection: "Quel service aimeriez-vous rendre vraiment incontournable dans les douze prochains mois ?"
        }
      }
    },
    {
      id: "animation", number: "11", title: "Animation & engagement du réseau", icon: "network",
      profile: {
        centrale: {
          open: "Comment parvenez-vous à mobiliser vos adhérents autour d'une initiative commune ?",
          explore: ["Quels relais sont aujourd'hui les plus écoutés dans votre réseau ?", "Comment les animateurs régionaux font-ils remonter les attentes du terrain ?", "Quelles actions collectives ont réellement suscité de l'adhésion récemment ?"],
          impact: ["Qu'est-ce qui bloque le déploiement lorsqu'une action fonctionne bien au siège mais peu sur le terrain ?", "Que risquez-vous si la centrale ne parvient pas à entraîner ses adhérents ?"],
          projection: "Quel fonctionnement vous permettrait de faire davantage avec le réseau, sans alourdir les équipes ?"
        }
      }
    },
    {
      id: "innovation", number: "12", title: "Équipements, formation & innovation", icon: "spark",
      profile: {
        centre: {
          open: "Quelles évolutions techniques ou organisationnelles pourraient améliorer votre façon de travailler ?",
          explore: ["Comment décidez-vous d'investir dans un nouvel équipement ?", "Quels outils vous feraient gagner du temps lors des mesures, réglages ou suivis ?", "Sur quels sujets vos équipes aimeraient-elles progresser ?"],
          impact: ["Quand un équipement ou une compétence manque, qu'est-ce que cela change au quotidien ?", "Quels projets reportez-vous aujourd'hui faute de temps, de moyens ou d'accompagnement ?"],
          projection: "Si vous pouviez faire évoluer un seul outil ou une seule compétence cette année, lequel choisiriez-vous ?"
        },
        centrale: {
          open: "Quels outils, formations ou services nouveaux pourraient faire progresser l'ensemble de vos adhérents ?",
          explore: ["Comment repérez-vous les innovations réellement utiles sur le terrain ?", "Quels sujets de formation reviennent le plus souvent ?", "Quels freins rencontrez-vous pour déployer de nouveaux équipements ou pratiques ?"],
          impact: ["Quelles conséquences voyez-vous quand une innovation reste réservée à quelques adhérents ?", "Qu'est-ce qui ralentit le plus le passage de l'idée à l'utilisation réelle ?"],
          projection: "Quel projet aimeriez-vous tester à petite échelle avant de l'élargir au réseau ?"
        }
      }
    },
    {
      id: "partenariats", number: "13", title: "Partenariats & politique d'achat", icon: "handshake",
      profile: {
        centre: {
          open: "Qu'attendez-vous aujourd'hui d'un fournisseur, au-delà des appareils et des conditions tarifaires ?",
          explore: ["Comment répartissez-vous vos achats entre les différents fabricants ?", "Quels services ou engagements d'un fournisseur vous ont réellement aidé récemment ?", "Qu'est-ce qui pourrait vous amener à faire évoluer vos partenariats ?"],
          impact: ["Dans quelles situations un partenariat fournisseur devient-il contraignant pour vous ?", "Quand vous pensez à 2027, quels risques cherchez-vous avant tout à éviter ?"],
          projection: "Si un fabricant pouvait réellement contribuer à votre réussite, qu'aimeriez-vous qu'il vous apporte ?"
        },
        centrale: {
          open: "Qu'attendez-vous d'un partenariat fabricant qui soit réellement utile à votre centrale et à vos adhérents ?",
          explore: ["Comment les décisions d'achat se prennent-elles entre la centrale et les membres ?", "Qu'est-ce qui fait qu'un accord-cadre se traduit — ou non — en volume sur le terrain ?", "Quels services complémentaires pourraient renforcer l'intérêt des adhérents pour vos accords ?"],
          impact: ["Qu'est-ce qui fragilise le plus la relation entre vos adhérents et les fabricants ?", "Quels sont les effets des achats réalisés en dehors des accords de la centrale ?"],
          projection: "À la fin de 2027, qu'est-ce qui vous fera dire qu'un partenariat fournisseur a vraiment réussi ?"
        }
      }
    }
  ];

    const list = document.getElementById("topic-list");
    const options = document.querySelectorAll("[data-profile]");
    let activeProfile = "centre";

    function group(label, questions) {
      const section = document.createElement("section");
      section.className = "question-section";
      const heading = document.createElement("h3");
      heading.textContent = label;
      section.appendChild(heading);
      if (Array.isArray(questions)) {
        const items = document.createElement("ul");
        for (const question of questions) {
          const item = document.createElement("li");
          item.textContent = question;
          items.appendChild(item);
        }
        section.appendChild(items);
      } else {
        const paragraph = document.createElement("p");
        paragraph.className = "question-projection";
        paragraph.textContent = questions;
        section.appendChild(paragraph);
      }
      return section;
    }

    function buildCard(topic) {
      const questions = topic.profile[activeProfile];
      const article = document.createElement("article");
      article.className = "topic-card";
      article.dataset.expanded = "false";
      const toggle = document.createElement("button");
      toggle.type = "button";
      toggle.className = "topic-toggle";
      toggle.setAttribute("aria-expanded", "false");
      toggle.setAttribute("aria-controls", "topic-body-" + topic.id);
      const label = document.createElement("span");
      label.textContent = topic.title;
      const chevron = document.createElement("span");
      chevron.className = "chevron";
      chevron.setAttribute("aria-hidden", "true");
      toggle.append(label, chevron);

      const content = document.createElement("div");
      content.id = "topic-body-" + topic.id;
      content.className = "topic-body";
      content.hidden = true;
      const opening = document.createElement("div");
      opening.className = "question-open";
      opening.textContent = questions.open;
      content.append(
        opening,
        group("Approfondir", questions.explore),
        group("Enjeux & conséquences", questions.impact),
        group("Se projeter", questions.projection)
      );
      article.append(toggle, content);
      toggle.addEventListener("click", () => {
        const willOpen = content.hidden;
        const previous = list.querySelector('.topic-card[data-expanded="true"]');
        if (previous && previous !== article) {
          previous.dataset.expanded = "false";
          previous.querySelector(".topic-toggle").setAttribute("aria-expanded", "false");
          previous.querySelector(".topic-body").hidden = true;
        }
        content.hidden = !willOpen;
        article.dataset.expanded = String(willOpen);
        toggle.setAttribute("aria-expanded", String(willOpen));
      });
      return article;
    }

    function render() {
      const available = topics.filter(topic => Boolean(topic.profile[activeProfile]));
      list.replaceChildren(...available.map(buildCard));
    }

    for (const button of options) {
      button.addEventListener("click", () => {
        if (button.dataset.profile === activeProfile) return;
        activeProfile = button.dataset.profile;
        for (const choice of options) {
          choice.setAttribute("aria-pressed", String(choice.dataset.profile === activeProfile));
        }
        render();
      });
    }
    render();
  })();
  </script>
</body>
</html>
